name: Build & Release Auto

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  APP_NAME: "NyroBrowser"
  OUT_INSTALLER: "NyroBrowser-Setup.exe"

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ✅ FIX: Use PowerShell syntax for Windows
      - name: Create Installer Folder
        run: |
          New-Item -ItemType Directory -Force -Path "installer"

      # ✅ FIX: Download proper ICO (not SVG) for NSIS
      - name: Download Installer Assets
        run: |
          # Download PNG loading screen
          Invoke-WebRequest -Uri "https://placehold.co/150x57/202124/white?text=Loading+NyroBrowser" -OutFile "installer/loading_screen.png"
          # Download ICO icon (convert via API or use direct ICO link)
          Invoke-WebRequest -Uri "https://www.iconpacks.net/icons/2/free-google-chrome-icon-2631-thumb.png" -OutFile "installer/temp_icon.png"
          # Convert PNG to ICO using ImageMagick (pre-installed on windows-latest)
          magick "installer/temp_icon.png" -define icon:auto-resize=256,128,64,48,32,16 "installer/app_icon.ico"
          Remove-Item "installer/temp_icon.png"

      - name: Install NSIS
        run: choco install nsis --no-progress

      - name: Build App
        run: ./gradlew installDist --no-daemon

      - name: Stage Installer
        run: |
          New-Item -ItemType Directory -Force -Path "dist/package"
          Copy-Item -Recurse "build/install/NyroBrowser/*" "dist/package/"
          Copy-Item "installer/loading_screen.png" "dist/package/"
          Copy-Item "installer/app_icon.ico" "dist/package/"

      - name: Compile NSIS Installer
        run: |
          makensis /V3 /DAPP_NAME="${{ env.APP_NAME }}" /DOUTFILE="${{ env.OUT_INSTALLER }}" installer/setup.nsi
          Move-Item "${{ env.OUT_INSTALLER }}" "dist/${{ env.OUT_INSTALLER }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/${{ env.OUT_INSTALLER }}
          retention-days: 30

      - name: Auto Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "auto-build-${{ github.run_number }}"
          name: "NyroBrowser Build #${{ github.run_number }}"
          draft: false
          generate_release_notes: true
          files: dist/${{ env.OUT_INSTALLER }}
