name: Build & Release Android

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # THIS STEP IS REQUIRED: It installs Gradle so we don't need the wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # NO 'chmod +x gradlew' step here anymore!

      - name: Build Debug APK
        # We use the 'gradle' command directly instead of './gradlew'
        run: gradle assembleDebug --no-daemon

      - name: Build Release AAB
        run: gradle bundleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nyro-browser-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: nyro-browser-release
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "NyroBrowser Auto-Build #${{ github.run_number }}"
          draft: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
