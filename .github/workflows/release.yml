# .github/workflows/release.yml
# Nyro Browser — Cross-Platform Build & Release Pipeline
#
# Triggers:
#   • Push to main  → builds a draft release artifact
#   • Tag push      → creates a full draft GitHub release with installers
#
# Platforms: Windows (x64), macOS (x64 + arm64), Ubuntu (x64)

name: 🚀 Nyro Browser Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"        # e.g. v1.0.0
  workflow_dispatch:    # allow manual triggering

# Cancel in-progress runs on the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # App metadata
  APP_NAME: nyro-browser
  NODE_VERSION: "20"
  RUST_VERSION: stable

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build & Release (all platforms via matrix)
  # ─────────────────────────────────────────────────────────────────────────
  build-tauri:
    name: Build — ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write   # needed to create/update releases

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            tauri_args: ""

          # macOS Intel
          - platform: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            tauri_args: "--target x86_64-apple-darwin"

          # macOS Apple Silicon
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            tauri_args: "--target aarch64-apple-darwin"

          # Ubuntu x64
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauri_args: ""

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Linux: install system dependencies ────────────────────────────
      - name: 🐧 Install Linux build dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev

      # ── 3. Node.js setup with npm cache ──────────────────────────────────
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # ── 4. Rust toolchain setup ──────────────────────────────────────────
      - name: 🦀 Setup Rust (${{ env.RUST_VERSION }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      # ── 5. Rust dependency cache (speeds up subsequent builds ~60%) ──────
      - name: 💾 Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: "rust-${{ matrix.platform }}"
          cache-on-failure: true

      # ── 6. Install Node dependencies ─────────────────────────────────────
      - name: 📦 Install Node.js dependencies
        run: npm ci --prefer-offline

      # ── 7. Build frontend ────────────────────────────────────────────────
      - name: 🔨 Build SolidJS frontend
        run: npm run build
        env:
          NODE_ENV: production

      # ── 8. Build Tauri app & create release ──────────────────────────────
      - name: 🏗️ Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (optional — set in repo secrets)
          APPLE_CERTIFICATE:           ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD:  ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:      ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:              ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (optional)
          TAURI_SIGNING_PRIVATE_KEY:   ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Tag name for the GitHub release (uses git tag or a dated build)
          tagName:         ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('nightly-{0}', github.run_number) }}
          releaseName:     "Nyro Browser ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Nightly Build' }}"
          releaseBody:     |
            ## Nyro Browser — ${{ github.ref_name }}

            ### What's new
            > See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ### Downloads
            | Platform | Installer |
            |---|---|
            | 🪟 Windows | `.exe` (NSIS installer) or `.msi` |
            | 🐧 Linux   | `.AppImage` or `.deb` |
            | 🍎 macOS   | `.dmg` |

            ---
            *Built from commit `${{ github.sha }}`*
          releaseDraft:    true       # Always create a draft — manually publish
          prerelease:      ${{ !startsWith(github.ref, 'refs/tags/v') }}
          args:            ${{ matrix.tauri_args }}
          includeUpdaterJson: false

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Notify on completion (optional — needs a SLACK_WEBHOOK secret)
  # ─────────────────────────────────────────────────────────────────────────
  notify:
    name: 📣 Notify build status
    needs: build-tauri
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Post build result
        run: |
          STATUS="${{ needs.build-tauri.result }}"
          echo "Build status: $STATUS"
          # Extend here with a curl call to Slack / Discord webhook if desired
