name: 🚀 Nyro Browser Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: nyro-browser
  NODE_VERSION: "20"
  RUST_VERSION: stable

jobs:
  build-tauri:
    name: Build — windows-x64
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🦀 Setup Rust (${{ env.RUST_VERSION }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: 💾 Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: "rust-windows-x64"
          cache-on-failure: true

      - name: 📦 Install Node.js dependencies
        run: npm install

      - name: 🔨 Build SolidJS frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🏗️ Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName:         ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('nightly-{0}', github.run_number) }}
          releaseName:     "Nyro Browser ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Nightly Build' }}"
          releaseBody:     |
            ## Nyro Browser — ${{ github.ref_name }}

            ### Downloads
            | Platform | Installer |
            |---|---|
            | 🪟 Windows | `.exe` (NSIS installer) or `.msi` |

            ---
            *Built from commit `${{ github.sha }}`*
          releaseDraft:    true
          prerelease:      ${{ !startsWith(github.ref, 'refs/tags/v') }}
          includeUpdaterJson: false
