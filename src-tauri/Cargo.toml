[package]
name = "nyro-browser"
version = "1.0.0"
description = "Nyro Browser - A lightweight Chrome-like desktop browser"
authors = ["Nyro Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
  "window-all",
  "shell-open"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"

[features]
# This is automatically set by Tauri CLI in development mode.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"      # Optimize for binary size
lto = true           # Link-Time Optimization
codegen-units = 1    # Better optimization at cost of compile time
panic = "abort"      # Smaller binary, no unwinding
strip = true         # Strip debug symbols
