<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NyroBrowser</title>
    <style>
        :root { --bg: #202124; --tab-bg: #292a2d; --active-tab: #323639; --text: #e8eaed; --accent: #4285f4; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .tab-bar { display: flex; background: var(--bg); padding: 8px 8px 0; gap: 4px; }
        .tab { background: var(--tab-bg); padding: 8px 16px; border-radius: 8px 8px 0 0; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .tab.active { background: var(--active-tab); }
        .new-tab { background: var(--tab-bg); border: none; color: white; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
        .toolbar { display: flex; align-items: center; padding: 8px; background: var(--active-tab); gap: 10px; }
        .nav-btn { background: none; border: none; color: var(--text); padding: 6px; cursor: pointer; font-size: 1.2rem; border-radius: 4px; }
        .nav-btn:hover { background: #3c4043; }
        .omnibox { flex: 1; background: var(--bg); border: 1px solid #3c4043; border-radius: 24px; padding: 8px 16px; color: var(--text); outline: none; }
        .omnibox:focus { border-color: var(--accent); }
        #content { flex: 1; background: #fff; display: flex; align-items: center; justify-content: center; color: #555; }
    </style>
</head>
<body>
    <div class="tab-bar">
        <div class="tab active">🌐 New Tab <span style="margin-left:8px;cursor:pointer;">×</span></div>
        <button class="new-tab">+</button>
    </div>
    <div class="toolbar">
        <button class="nav-btn">◀</button>
        <button class="nav-btn">▶</button>
        <button class="nav-btn">🔄</button>
        <input class="omnibox" type="text" placeholder="Search or enter URL" id="urlBar">
        <button class="nav-btn">⭐</button>
        <button class="nav-btn">⚙️</button>
    </div>
    <div id="content">
        <div style="text-align:center;">
            <h1>NyroBrowser</h1>
            <p>Powered by Kotlin + Chromium (JCEF)</p>
        </div>
    </div>
</body>
</html>
