name: Build & Release Auto

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  APP_NAME: "NyroBrowser"
  OUT_INSTALLER: "NyroBrowser-Setup.exe"

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 1. Download Installer Assets (Loading Screen & Icon)
      - name: Download Installer Assets
        run: |
          mkdir -p installer
          # Generic browser icon
          Invoke-WebRequest -Uri "https://upload.wikimedia.org/wikipedia/commons/4/49/Google_Chrome_icon_%28February_2022%29.svg" -OutFile "installer/app_icon.ico" 
          # Simple loading screen (using a reliable placeholder)
          Invoke-WebRequest -Uri "https://placehold.co/150x57/202124/white?text=Loading+NyroBrowser" -OutFile "installer/loading_screen.png"

      # 2. Install NSIS
      - name: Install NSIS
        run: choco install nsis --no-progress

      # 3. Build Kotlin App
      - name: Build App
        run: ./gradlew build --no-daemon

      # 4. Package for Installer (Stage files)
      - name: Stage Installer
        run: |
          mkdir -p dist/package
          # Copy the fat JAR or the exploded dist
          Copy-Item "build/libs/*.jar" "dist/package/app.jar"
          # JCEF needs native libs - Gradle usually puts them in a folder
          # We assume the build task packages them, or we copy the JCEF folder
          # For this simple setup, we assume a 'libs' folder with JCEF natives or a fat jar
          # JCEF usually requires a specific folder structure. 
          # We'll use the Gradle task to copy the runtime.
          ./gradlew installDist
          Copy-Item "build/install/NyroBrowser/*" "dist/package/" -Recurse -Force
          Copy-Item "installer/loading_screen.png" "dist/package/"
          Copy-Item "installer/app_icon.ico" "dist/package/"

      # 5. Compile NSIS Installer
      - name: Compile Installer
        run: |
          makensis /V3 /DAPP_NAME="${{ env.APP_NAME }}" /DOUTFILE="${{ env.OUT_INSTALLER }}" installer/setup.nsi
          Move-Item "${{ env.OUT_INSTALLER }}" "dist/${{ env.OUT_INSTALLER }}"

      # 6. Upload Artifact & Release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/${{ env.OUT_INSTALLER }}

      - name: Auto Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Auto Build #${{ github.run_number }}"
          draft: false
          generate_release_notes: true
          files: dist/${{ env.OUT_INSTALLER }}
